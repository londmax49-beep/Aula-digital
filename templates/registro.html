{% extends "base.html" %}

{% block title %}Crear cuenta | Aula Digital{% endblock %}

{% block content %}

<section class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-icon">🎓</div>

        <span class="tag">ÚNETE A AULA DIGITAL</span>

        <h1>Crear cuenta</h1>

        <p>Comienza tu aventura de aprendizaje.</p>

        <form method="POST">

            <label>Nombre completo</label>
            <input type="text"
                   name="nombre"
                   placeholder="Tu nombre"
                   required
                   maxlength="100">

            <label>Correo electrónico</label>
            <input type="email"
                   name="correo"
                   placeholder="correo@ejemplo.com"
                   required>

            <label>Contraseña</label>
            <input type="password"
                   name="password"
                   placeholder="Mínimo 6 caracteres"
                   minlength="6"
                   required>

            <label>Grado escolar</label>

            <select name="escolaridad" required>
                <option value="">Selecciona tu grado</option>

                {% for grado in grados %}
                    <option value="{{ grado }}">{{ grado }}</option>
                {% endfor %}
            </select>

            <button class="btn btn-full" type="submit">
                Crear mi cuenta 🚀
            </button>

        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>

    </div>

</section>

{% endblock %}
